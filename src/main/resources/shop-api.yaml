openapi: 3.0.3
info:
  title: Shop API
  version: 1.0.0
  description: REST API for managing customers, products, and orders.
servers:
  - url: http://localhost:18081/api/v1
    description: Local Spring Boot server (configured to avoid XAMPP Apache on port 8080)

# Customer resources
paths:
  /customers:
    get:
      tags:
        - Customers
      summary: List customers
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: A page of customers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPage'
              example:
                content:
                  - id: 1
                    name: Nguyen An
                    email: an@example.com
                    phone: '+84901234567'
                    address: 12 Le Loi, Ho Chi Minh City
                    createdAt: '2026-10-14T09:30:00Z'
                page: 0
                size: 10
                totalElements: 1
                totalPages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags:
        - Customers
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
            example:
              name: Nguyen An
              email: an@example.com
              phone: '+84901234567'
              address: 12 Le Loi, Ho Chi Minh City
      responses:
        '201':
          description: Customer created
          headers:
            Location:
              description: URI of the created customer
              schema:
                type: string
                example: /api/v1/customers/1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
              example:
                id: 1
                name: Nguyen An
                email: an@example.com
                phone: '+84901234567'
                address: 12 Le Loi, Ho Chi Minh City
                createdAt: '2026-10-14T09:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
  /customers/{customerId}:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    get:
      tags:
        - Customers
      summary: Get a customer
      responses:
        '200':
          description: Customer details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
              example:
                id: 1
                name: Nguyen An
                email: an@example.com
                phone: '+84901234567'
                address: 12 Le Loi, Ho Chi Minh City
                createdAt: '2026-10-14T09:30:00Z'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Customers
      summary: Replace a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
            example:
              name: Nguyen An
              email: an@example.com
              phone: '+84901234567'
              address: 12 Le Loi, Ho Chi Minh City
      responses:
        '200':
          description: Customer updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
              example:
                id: 1
                name: Nguyen An
                email: an@example.com
                phone: '+84901234567'
                address: 12 Le Loi, Ho Chi Minh City
                createdAt: '2026-10-14T09:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Customers
      summary: Partially update a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerPatch'
            example:
              phone: '+84987654321'
      responses:
        '200':
          description: Customer updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
              example:
                id: 1
                name: Nguyen An
                email: an@example.com
                phone: '+84987654321'
                address: 12 Le Loi, Ho Chi Minh City
                createdAt: '2026-10-14T09:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Customers
      summary: Delete a customer
      responses:
        '204':
          description: Customer deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /customers/{customerId}/orders:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    get:
      tags:
        - Customers
        - Orders
      summary: List orders for a customer
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: A page of the customer's orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
              example:
                content:
                  - id: 1001
                    customerId: 1
                    items:
                      - productId: 101
                        quantity: 2
                        unitPrice: 19.99
                    totalAmount: 39.98
                    status: PENDING
                    createdAt: '2026-10-14T10:00:00Z'
                page: 0
                size: 10
                totalElements: 1
                totalPages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

# Authentication and category resources
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a customer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationInput'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /auth/login:
    post:
      tags: [Authentication]
      summary: Sign in with customer credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /categories:
    get:
      tags: [Categories]
      summary: List product categories
      responses:
        '200':
          description: Available categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
    post:
      tags: [Categories]
      summary: Create a product category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

# Product resources
  /products:
    get:
      tags:
        - Products
      summary: List products
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - name: q
          in: query
          description: Search product name and description
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: minPrice
          in: query
          schema:
            type: number
            minimum: 0
        - name: maxPrice
          in: query
          schema:
            type: number
            minimum: 0
      responses:
        '200':
          description: A page of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
              example:
                content:
                  - id: 101
                    name: Ceramic Mug
                    description: Handmade ceramic coffee mug
                    category: Kitchen
                    price: 19.99
                    stock: 25
                page: 0
                size: 10
                totalElements: 1
                totalPages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags:
        - Products
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
            example:
              name: Ceramic Mug
              description: Handmade ceramic coffee mug
              category: Kitchen
              price: 19.99
              stock: 25
      responses:
        '201':
          description: Product created
          headers:
            Location:
              description: URI of the created product
              schema:
                type: string
                example: /api/v1/products/101
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                id: 101
                name: Ceramic Mug
                description: Handmade ceramic coffee mug
                category: Kitchen
                price: 19.99
                stock: 25
        '400':
          $ref: '#/components/responses/BadRequest'
  /products/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags:
        - Products
      summary: Get a product
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                id: 101
                name: Ceramic Mug
                description: Handmade ceramic coffee mug
                category: Kitchen
                price: 19.99
                stock: 25
        '404':
          $ref: '#/components/responses/NotFound'

# Shopping basket is held client-side; checkout creates a persistent order.
    put:
      tags:
        - Products
      summary: Replace a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
            example:
              name: Ceramic Mug
              description: Handmade ceramic coffee mug
              category: Kitchen
              price: 19.99
              stock: 25
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                id: 101
                name: Ceramic Mug
                description: Handmade ceramic coffee mug
                category: Kitchen
                price: 19.99
                stock: 25
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Products
      summary: Partially update a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductPatch'
            example:
              price: 17.99
              stock: 30
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                id: 101
                name: Ceramic Mug
                description: Handmade ceramic coffee mug
                category: Kitchen
                price: 17.99
                stock: 30
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Products
      summary: Delete a product
      responses:
        '204':
          description: Product deleted
        '404':
          $ref: '#/components/responses/NotFound'

# Order resources
  /orders:
    get:
      tags:
        - Orders
      summary: List orders
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: A page of orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
              example:
                content:
                  - id: 1001
                    customerId: 1
                    items:
                      - productId: 101
                        quantity: 2
                        unitPrice: 19.99
                    totalAmount: 39.98
                    status: PENDING
                    createdAt: '2026-10-14T10:00:00Z'
                page: 0
                size: 10
                totalElements: 1
                totalPages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags:
        - Orders
      summary: Create an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
            example:
              customerId: 1
              items:
                - productId: 101
                  quantity: 2
      responses:
        '201':
          description: Order created
          headers:
            Location:
              description: URI of the created order
              schema:
                type: string
                example: /api/v1/orders/1001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: 1001
                customerId: 1
                items:
                  - productId: 101
                    quantity: 2
                    unitPrice: 19.99
                totalAmount: 39.98
                status: PENDING
                createdAt: '2026-10-14T10:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags:
        - Orders
      summary: Get an order
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: 1001
                customerId: 1
                items:
                  - productId: 101
                    quantity: 2
                    unitPrice: 19.99
                totalAmount: 39.98
                status: PENDING
                createdAt: '2026-10-14T10:00:00Z'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Orders
      summary: Replace an order's items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
            example:
              customerId: 1
              items:
                - productId: 101
                  quantity: 3
      responses:
        '200':
          description: Order updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: 1001
                customerId: 1
                items:
                  - productId: 101
                    quantity: 3
                    unitPrice: 19.99
                totalAmount: 59.97
                status: PENDING
                createdAt: '2026-10-14T10:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    patch:
      tags:
        - Orders
      summary: Partially update an order's status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderPatch'
            example:
              status: PAID
      responses:
        '200':
          description: Order updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: 1001
                customerId: 1
                items:
                  - productId: 101
                    quantity: 2
                    unitPrice: 19.99
                totalAmount: 39.98
                status: PAID
                createdAt: '2026-10-14T10:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags:
        - Orders
      summary: Delete an order
      responses:
        '204':
          description: Order deleted
        '404':
          $ref: '#/components/responses/NotFound'

# Reusable parameters, responses, and data schemas
components:
  parameters:
    Page:
      name: page
      in: query
      description: Zero-based page index
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
        example: 0
    Size:
      name: size
      in: query
      description: Number of items per page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
        example: 10
    Sort:
      name: sort
      in: query
      description: Sort field and direction, for example price,desc
      required: false
      schema:
        type: string
        example: price,desc
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 1
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 101
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 1001
  responses:
    BadRequest:
      description: Invalid request or validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: VALIDATION_ERROR
            message: Request validation failed
            details:
              - field: email
                message: must be a valid email address
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: NOT_FOUND
            message: Resource not found
            details: []
    UnprocessableEntity:
      description: Request is valid but cannot be processed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: INSUFFICIENT_STOCK
            message: One or more products do not have enough stock
            details:
              - field: items
                message: Product 101 has insufficient stock
  schemas:
    RegistrationInput:
      type: object
      required: [name, email, password, phone]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Nguyen An
        email:
          type: string
          format: email
          maxLength: 254
          example: an@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: shop12345
        phone:
          type: string
          minLength: 7
          maxLength: 30
          example: '+84901234567'
        address:
          type: string
          maxLength: 255
          example: 12 Le Loi, Ho Chi Minh City
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: an@example.com
        password:
          type: string
          format: password
          example: shop12345
    AuthResponse:
      type: object
      required: [token, customer]
      properties:
        token:
          type: string
          description: Demo bearer token for the prototype; not an authorization credential.
          example: demo-2c79e7e7
        customer:
          $ref: '#/components/schemas/Customer'
    Category:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          maxLength: 100
          example: Kitchen
        description:
          type: string
          maxLength: 500
          example: Kitchen and dining products
    CategoryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Kitchen
        description:
          type: string
          maxLength: 500
          example: Kitchen and dining products
    CustomerInput:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Nguyen An
        email:
          type: string
          format: email
          maxLength: 254
          example: an@example.com
        phone:
          type: string
          minLength: 1
          maxLength: 30
          description: Phone number; no exact format is specified by the assignment.
          example: '+84901234567'
        address:
          type: string
          minLength: 1
          maxLength: 255
          example: 12 Le Loi, Ho Chi Minh City
      example:
        name: Nguyen An
        email: an@example.com
        phone: '+84901234567'
        address: 12 Le Loi, Ho Chi Minh City
    CustomerPatch:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Nguyen An
        email:
          type: string
          format: email
          maxLength: 254
          example: an@example.com
        phone:
          type: string
          minLength: 1
          maxLength: 30
          description: Phone number; no exact format is specified by the assignment.
          example: '+84987654321'
        address:
          type: string
          minLength: 1
          maxLength: 255
          example: 12 Le Loi, Ho Chi Minh City
      example:
        phone: '+84987654321'
    Customer:
      type: object
      required:
        - id
        - name
        - email
        - createdAt
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 1
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Nguyen An
        email:
          type: string
          format: email
          maxLength: 254
          example: an@example.com
        phone:
          type: string
          minLength: 1
          maxLength: 30
          description: Phone number; no exact format is specified by the assignment.
          example: '+84901234567'
        address:
          type: string
          minLength: 1
          maxLength: 255
          example: 12 Le Loi, Ho Chi Minh City
        createdAt:
          type: string
          format: date-time
          example: '2026-10-14T09:30:00Z'
      example:
        id: 1
        name: Nguyen An
        email: an@example.com
        phone: '+84901234567'
        address: 12 Le Loi, Ho Chi Minh City
        createdAt: '2026-10-14T09:30:00Z'
    ProductInput:
      type: object
      required:
        - name
        - price
        - stock
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
          example: Ceramic Mug
        description:
          type: string
          maxLength: 2000
          example: Handmade ceramic coffee mug
        category:
          type: string
          minLength: 1
          maxLength: 100
          example: Kitchen
        imageUrl:
          type: string
          format: uri
          example: https://picsum.photos/seed/mug/600/400
        price:
          type: number
          format: double
          minimum: 0
          example: 19.99
        stock:
          type: integer
          minimum: 0
          example: 25
      example:
        name: Ceramic Mug
        description: Handmade ceramic coffee mug
        category: Kitchen
        price: 19.99
        stock: 25
    ProductPatch:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
          example: Ceramic Mug
        description:
          type: string
          maxLength: 2000
          example: Handmade ceramic coffee mug
        category:
          type: string
          minLength: 1
          maxLength: 100
          example: Kitchen
        imageUrl:
          type: string
          format: uri
          example: https://picsum.photos/seed/mug/600/400
        price:
          type: number
          format: double
          minimum: 0
          example: 17.99
        stock:
          type: integer
          minimum: 0
          example: 30
      example:
        price: 17.99
        stock: 30
    Product:
      type: object
      required:
        - id
        - name
        - price
        - stock
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 101
        name:
          type: string
          minLength: 1
          maxLength: 150
          example: Ceramic Mug
        description:
          type: string
          maxLength: 2000
          example: Handmade ceramic coffee mug
        category:
          type: string
          minLength: 1
          maxLength: 100
          example: Kitchen
        imageUrl:
          type: string
          format: uri
          example: https://picsum.photos/seed/mug/600/400
        price:
          type: number
          format: double
          minimum: 0
          example: 19.99
        stock:
          type: integer
          minimum: 0
          example: 25
      example:
        id: 101
        name: Ceramic Mug
        description: Handmade ceramic coffee mug
        category: Kitchen
        price: 19.99
        stock: 25
    OrderItemInput:
      type: object
      required:
        - productId
        - quantity
      properties:
        productId:
          type: integer
          format: int64
          minimum: 1
          example: 101
        quantity:
          type: integer
          minimum: 1
          example: 2
      example:
        productId: 101
        quantity: 2
    OrderItem:
      type: object
      required:
