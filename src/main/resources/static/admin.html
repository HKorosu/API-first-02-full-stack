<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Shop API | Quản trị</title>
<style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#162033;background:#f3f6fa}body{max-width:1200px;margin:28px auto;padding:0 20px}header,.panel{background:#fff;border:1px solid #dce3ec;border-radius:12px;padding:18px;margin-bottom:18px}header{display:flex;gap:16px;align-items:center}h1{margin:0 auto 0 0}input,select,button{font:inherit;padding:9px;border:1px solid #cbd5e1;border-radius:7px}button{background:#2059c7;color:#fff;border:0;cursor:pointer}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #e4e9f0}td input{max-width:100px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.notice{white-space:pre-wrap;color:#1e3a8a}.muted{color:#64748b}@media(max-width:700px){.grid{grid-template-columns:1fr}table{font-size:.85rem}}
</style></head><body>
<header><h1>Quản trị Shop API</h1><a href="/storefront.html">Mở cửa hàng</a></header>
<section class="panel"><label>API URL <input id="api-base" value="/api/v1" style="width:min(100%,500px)"></label><p class="muted">Đây là giao diện demo quản trị, chưa có phân quyền quản trị.</p><button id="reload">Tải lại dữ liệu</button><p id="message" class="notice"></p></section>
<div class="grid"><section class="panel"><h2>Quản lý tồn kho</h2><form id="product-form"><input id="p-name" placeholder="Tên sản phẩm" required><input id="p-category" placeholder="Danh mục" required><input id="p-price" type="number" min="0" step="0.01" placeholder="Giá" required><input id="p-stock" type="number" min="0" placeholder="Tồn kho" required><input id="p-image" type="url" placeholder="URL hình ảnh"><input id="p-description" placeholder="Mô tả"><button>Thêm sản phẩm</button></form><div style="overflow:auto"><table><thead><tr><th>Sản phẩm</th><th>Danh mục</th><th>Giá</th><th>Tồn kho</th><th>Lưu</th></tr></thead><tbody id="products"></tbody></table></div></section>
<section class="panel"><h2>Danh mục</h2><form id="category-form"><input id="category-name" placeholder="Tên danh mục" required maxlength="100"><input id="category-description" placeholder="Mô tả"><button>Thêm danh mục</button></form><ul id="categories"></ul><h2>Đơn hàng</h2><div style="overflow:auto"><table><thead><tr><th>Mã</th><th>Khách</th><th>Tổng</th><th>Trạng thái</th><th>Cập nhật</th></tr></thead><tbody id="orders"></tbody></table></div></section></div>
<script>
const base=document.querySelector('#api-base'),message=document.querySelector('#message');const api=()=>base.value.trim().replace(/\/+$/,'');const endpoint=p=>{const root=api();return root.endsWith('/api/v1')||root.includes(':4010')?root+p:root+'/api/v1'+p};
async function request(path,options={}){const response=await fetch(endpoint(path),{headers:{'Content-Type':'application/json'},...options});const body=response.status===204?null:await response.json().catch(()=>null);if(!response.ok)throw Error(body?.message||`HTTP ${response.status}`);return body}
function say(text){message.textContent=text}
async function load(){try{const [products,categories,orders]=await Promise.all([request('/products?page=0&size=100&sort=id,asc'),request('/categories'),request('/orders?page=0&size=100&sort=id,desc')]);const rows=products.content.map(p=>{const tr=document.createElement('tr');const name=document.createElement('td');name.textContent=p.name;const cat=document.createElement('td');cat.textContent=p.category||'';const price=document.createElement('td');price.textContent=Number(p.price).toFixed(2);const stock=document.createElement('td');const input=document.createElement('input');input.type='number';input.min='0';input.value=p.stock;input.dataset.id=p.id;stock.append(input);const action=document.createElement('td');const button=document.createElement('button');button.textContent='Cập nhật';button.onclick=async()=>{try{await request('/products/'+p.id,{method:'PATCH',body:JSON.stringify({stock:Number(input.value)})});say('Đã cập nhật tồn kho sản phẩm '+p.id);load()}catch(e){say(e.message)}};action.append(button);tr.append(name,cat,price,stock,action);return tr});document.querySelector('#products').replaceChildren(...rows);document.querySelector('#categories').replaceChildren(...categories.map(c=>{const li=document.createElement('li');li.textContent=c.name+(c.description?' — '+c.description:'');return li}));const orderRows=orders.content.map(o=>{const tr=document.createElement('tr');const id=document.createElement('td');id.textContent=o.id;const customer=document.createElement('td');customer.textContent=o.customerId;const amount=document.createElement('td');amount.textContent=Number(o.totalAmount).toFixed(2);const status=document.createElement('td');const select=document.createElement('select');for(const value of ['PENDING','PAID','SHIPPED','CANCELLED']){const option=document.createElement('option');option.value=value;option.textContent=value;option.selected=o.status===value;select.append(option)}status.append(select);const save=document.createElement('td');const button=document.createElement('button');button.textContent='Lưu';button.disabled=['SHIPPED','CANCELLED'].includes(o.status);button.onclick=async()=>{try{await request('/orders/'+o.id,{method:'PATCH',body:JSON.stringify({status:select.value})});say('Đã đổi trạng thái đơn '+o.id);load()}catch(e){say(e.message)}};save.append(button);tr.append(id,customer,amount,status,save);return tr});document.querySelector('#orders').replaceChildren(...orderRows);say(`Đã tải ${products.totalElements} sản phẩm và ${orders.totalElements} đơn hàng.`)}catch(e){say('Không tải được dữ liệu: '+e.message)}}
document.querySelector('#reload').onclick=load;document.querySelector('#product-form').onsubmit=async e=>{e.preventDefault();try{await request('/products',{method:'POST',body:JSON.stringify({name:document.querySelector('#p-name').value,category:document.querySelector('#p-category').value,price:Number(document.querySelector('#p-price').value),stock:Number(document.querySelector('#p-stock').value),imageUrl:document.querySelector('#p-image').value||null,description:document.querySelector('#p-description').value})});say('Đã tạo sản phẩm.');e.target.reset();load()}catch(error){say(error.message)}};document.querySelector('#category-form').onsubmit=async e=>{e.preventDefault();try{await request('/categories',{method:'POST',body:JSON.stringify({name:document.querySelector('#category-name').value,description:document.querySelector('#category-description').value})});say('Đã tạo danh mục.');e.target.reset();load()}catch(error){say(error.message)}};load();
</script></body></html>
