<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop API | Cửa hàng</title>
  <style>
    :root{font-family:Segoe UI,Arial,sans-serif;color:#172033;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}header{background:#14213d;color:white;padding:18px max(24px,calc((100% - 1180px)/2));display:flex;align-items:center;gap:18px;flex-wrap:wrap}header h1{font-size:1.4rem;margin:0 auto 0 0}input,select,button{font:inherit;padding:10px;border:1px solid #cbd5e1;border-radius:8px}button{background:#2257cc;color:white;border:0;cursor:pointer;font-weight:650}button:disabled{opacity:.5;cursor:wait}main{max-width:1180px;margin:24px auto;padding:0 20px}.filters,.panel{background:white;border:1px solid #dde3ed;border-radius:12px;padding:18px;margin-bottom:18px}.filters{display:flex;gap:10px;flex-wrap:wrap}.filters input[type=search]{flex:1;min-width:180px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.card{background:white;border:1px solid #dde3ed;border-radius:12px;overflow:hidden}.card img{width:100%;height:150px;object-fit:cover;background:#e8edf5}.card div{padding:14px}.card h3{margin:0 0 8px}.muted{color:#64748b}.price{font-weight:700;color:#17469f}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.cart-row{display:grid;grid-template-columns:1fr 100px auto;gap:12px;padding:10px 0;border-bottom:1px solid #e5eaf0;align-items:center}.notice{padding:12px;background:#edf4ff;border-radius:8px;white-space:pre-wrap}.hidden{display:none}.pager{display:flex;gap:10px;justify-content:center;padding:20px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}form{display:grid;gap:10px}dialog{border:0;border-radius:14px;max-width:460px;width:calc(100% - 30px);box-shadow:0 20px 80px #0004}dialog::backdrop{background:#0b122088}.right{margin-left:auto}@media(max-width:650px){.two{grid-template-columns:1fr}header{padding:16px 20px}.cart-row{grid-template-columns:1fr 75px auto}}
  </style>
</head>
<body>
<header><h1>Shop API</h1><span id="account-label">Khách</span><button id="auth-open">Đăng nhập / Đăng ký</button><button id="cart-jump">Giỏ hàng (<span id="cart-count">0</span>)</button><a href="/admin.html" style="color:white">Quản trị</a></header>
<main>
  <section class="panel"><label for="api-base">API URL</label> <input id="api-base" style="width:min(100%,520px)" value="/api/v1"> <span class="muted">Dùng /api/v1 cho backend; nhập http://127.0.0.1:4010 để thử Prism.</span></section>
  <section class="filters"><input id="search" type="search" placeholder="Tìm tên hoặc mô tả sản phẩm"><select id="category"><option value="">Tất cả danh mục</option></select><input id="min-price" type="number" min="0" placeholder="Giá từ"><input id="max-price" type="number" min="0" placeholder="Giá đến"><button id="search-button">Tìm sản phẩm</button></section>
  <section id="products" class="grid" aria-live="polite"></section><div class="pager"><button id="previous">Trang trước</button><span id="page-info"></span><button id="next">Trang sau</button></div>
  <section class="panel" id="cart"><div class="row"><h2>Giỏ hàng</h2><button id="clear-cart">Xóa giỏ</button></div><div id="cart-lines"></div><p class="row"><strong>Tổng cộng</strong><strong id="cart-total">0.00</strong></p><button id="checkout">Đặt hàng</button><div id="checkout-result" class="notice hidden"></div></section>
</main>
<dialog id="auth-dialog"><form id="auth-form"><h2>Tài khoản khách hàng</h2><label>Tên (để trống nếu đăng nhập)<input id="auth-name" maxlength="100"></label><label>Email<input id="auth-email" type="email" required></label><label>Mật khẩu<input id="auth-password" type="password" minlength="8" required></label><label>Điện thoại khi đăng ký<input id="auth-phone" value="+84901234567"></label><div class="row"><button type="submit">Đăng nhập</button><button type="button" id="register-button">Đăng ký</button><button type="button" id="auth-close">Đóng</button></div><div id="auth-message" class="notice hidden"></div></form></dialog>
<script>
const apiInput=document.querySelector('#api-base');let page=0,totalPages=0,cart=JSON.parse(localStorage.getItem('shop-cart')||'[]'),account=JSON.parse(localStorage.getItem('shop-account')||'null');
const api=()=>apiInput.value.trim().replace(/\/+$/,'');const endpoint=path=>{const base=api();return base.endsWith('/api/v1')||base.includes(':4010')?base+path:base+'/api/v1'+path};
async function request(path,options={}){const res=await fetch(endpoint(path),{headers:{'Content-Type':'application/json',...(options.headers||{})},...options});const body=res.status===204?null:await res.json().catch(()=>null);if(!res.ok)throw Error(body?.message||body?.detail||`HTTP ${res.status}`);return{status:res.status,body,location:res.headers.get('Location')}}
function announce(message){const box=document.querySelector('#checkout-result');box.textContent=message;box.classList.remove('hidden')}
function renderAccount(){document.querySelector('#account-label').textContent=account?account.customer.name:'Khách'}
function saveCart(){localStorage.setItem('shop-cart',JSON.stringify(cart));renderCart()}
function renderCart(){const lines=document.querySelector('#cart-lines');lines.replaceChildren();let total=0;for(const item of cart){total+=item.price*item.quantity;const row=document.createElement('div');row.className='cart-row';const title=document.createElement('span');title.textContent=`${item.name} — ${item.price.toFixed(2)}`;const qty=document.createElement('input');qty.type='number';qty.min='1';qty.value=item.quantity;qty.setAttribute('aria-label',`Số lượng ${item.name}`);qty.addEventListener('change',()=>{item.quantity=Math.max(1,Number(qty.value)||1);saveCart()});const remove=document.createElement('button');remove.textContent='Bỏ';remove.onclick=()=>{cart=cart.filter(p=>p.id!==item.id);saveCart()};row.append(title,qty,remove);lines.append(row)}document.querySelector('#cart-total').textContent=total.toFixed(2);document.querySelector('#cart-count').textContent=cart.reduce((n,p)=>n+p.quantity,0)}
function productCard(product){const card=document.createElement('article');card.className='card';const image=document.createElement('img');image.src=product.imageUrl||'https://picsum.photos/seed/shop-default/600/400';image.alt=product.name;image.loading='lazy';const body=document.createElement('div');const name=document.createElement('h3');name.textContent=product.name;const desc=document.createElement('p');desc.className='muted';desc.textContent=product.description||'';const category=document.createElement('p');category.className='muted';category.textContent=product.category||'Chưa phân loại';const line=document.createElement('div');line.className='row';const price=document.createElement('span');price.className='price';price.textContent=`${Number(product.price).toFixed(2)}`;const stock=document.createElement('span');stock.className='muted';stock.textContent=`Còn ${product.stock}`;const add=document.createElement('button');add.textContent='Thêm vào giỏ';add.disabled=product.stock<1;add.onclick=()=>{const found=cart.find(p=>p.id===product.id);if(found)found.quantity++;else cart.push({id:product.id,name:product.name,price:Number(product.price),quantity:1,stock:product.stock});saveCart()};line.append(price,stock);body.append(name,desc,category,line,add);card.append(image,body);return card}
async function loadCategories(){try{const {body}=await request('/categories');const select=document.querySelector('#category');for(const item of body){const option=document.createElement('option');option.value=item.name;option.textContent=item.name;select.append(option)}}catch(e){announce('Không tải được danh mục: '+e.message)}}
async function loadProducts(){const params=new URLSearchParams({page:String(page),size:'8',sort:'id,asc'});for(const [key,id] of [['q','search'],['category','category'],['minPrice','min-price'],['maxPrice','max-price']]){const value=document.querySelector('#'+id).value.trim();if(value)params.set(key,value)}try{const {body}=await request('/products?'+params);const grid=document.querySelector('#products');grid.replaceChildren(...body.content.map(productCard));totalPages=body.totalPages;document.querySelector('#page-info').textContent=`Trang ${body.page+1} / ${Math.max(totalPages,1)} (${body.totalElements} sản phẩm)`;document.querySelector('#previous').disabled=page<=0;document.querySelector('#next').disabled=page+1>=totalPages}catch(e){document.querySelector('#products').textContent='Không tải được sản phẩm: '+e.message}}
document.querySelector('#search-button').onclick=()=>{page=0;loadProducts()};document.querySelector('#previous').onclick=()=>{if(page>0){page--;loadProducts()}};document.querySelector('#next').onclick=()=>{if(page+1<totalPages){page++;loadProducts()}};document.querySelector('#clear-cart').onclick=()=>{cart=[];saveCart()};document.querySelector('#cart-jump').onclick=()=>document.querySelector('#cart').scrollIntoView({behavior:'smooth'});
document.querySelector('#auth-open').onclick=()=>document.querySelector('#auth-dialog').showModal();document.querySelector('#auth-close').onclick=()=>document.querySelector('#auth-dialog').close();
async function auth(register){const message=document.querySelector('#auth-message');try{const payload={email:document.querySelector('#auth-email').value,password:document.querySelector('#auth-password').value};let path='/auth/login';if(register){path='/auth/register';payload.name=document.querySelector('#auth-name').value;payload.phone=document.querySelector('#auth-phone').value;payload.address='';if(!payload.name)throw Error('Nhập tên để đăng ký.')}const {body}=await request(path,{method:'POST',body:JSON.stringify(payload)});account=body;localStorage.setItem('shop-account',JSON.stringify(account));renderAccount();message.textContent='Thao tác thành công.';message.classList.remove('hidden');setTimeout(()=>document.querySelector('#auth-dialog').close(),600)}catch(e){message.textContent=e.message;message.classList.remove('hidden')}}
document.querySelector('#auth-form').onsubmit=event=>{event.preventDefault();auth(false)};document.querySelector('#register-button').onclick=()=>auth(true);
document.querySelector('#checkout').onclick=async()=>{if(!cart.length){announce('Giỏ hàng đang trống.');return}if(!account){announce('Vui lòng đăng nhập hoặc đăng ký trước khi đặt hàng.');document.querySelector('#auth-dialog').showModal();return}try{const {body}=await request('/orders',{method:'POST',body:JSON.stringify({customerId:account.customer.id,items:cart.map(item=>({productId:item.id,quantity:item.quantity}))})});cart=[];saveCart();announce(`Đặt hàng thành công! Mã đơn: ${body.id}; tổng tiền: ${Number(body.totalAmount).toFixed(2)}; trạng thái: ${body.status}.`);loadProducts()}catch(e){announce('Đặt hàng chưa thành công: '+e.message)}};
renderCart();renderAccount();loadCategories();loadProducts();
</script>
</body>
</html>
